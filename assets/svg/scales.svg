<!-- SMUN loader: Scales of Justice. Line-drawn; ids are used by js/loader.js.
     Fulcrum (rotation origin for #beam-assembly) = 260,80. Pans must stay vertical (reposition in onUpdate). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-label="Scales of justice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F28C28" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#F28C28" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#F28C28" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="#1A2620" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle id="glow" cx="260" cy="52" r="90" fill="url(#glowGrad)" stroke="none" opacity="0"/>
    <!-- stand -->
    <path id="pillar" d="M260 80 L260 340"/>
    <path id="base" d="M188 340 L332 340"/>
    <path id="foot" d="M219 340 L234 322 L286 322 L301 340"/>
    <!-- beam (rotates around 260,80) -->
    <g id="beam-assembly">
      <path id="beam" d="M90 80 L430 80"/>
    </g>
    <!-- left pan group: hangs from beam end (90,80); keep vertical -->
    <g id="pan-left" class="pan">
      <path class="chain" d="M90 80 L39 185 M90 80 L141 185"/>
      <path class="bowl" d="M31 185 C39 222 141 222 149 185 Z"/>
    </g>
    <!-- right pan group: hangs from beam end (430,80); keep vertical -->
    <g id="pan-right" class="pan">
      <path class="chain" d="M430 80 L379 185 M430 80 L481 185"/>
      <path class="bowl" d="M371 185 C379 222 481 222 489 185 Z"/>
    </g>
    <circle id="knob" cx="260" cy="80" r="7" fill="#F4EEE2"/>
    <!-- flame: original path is 60x96; scaled .4 and placed so its base sits on the knob -->
    <path id="flame" transform="translate(248 32) scale(.4)" fill="#F28C28" stroke="none" opacity="0"
      d="M30 0 C45 25 60 40 60 62 C60 82 46 96 30 96 C14 96 0 82 0 62 C0 45 12 35 18 20 C20 34 26 40 30 42 C28 28 26 14 30 0 Z"/>
  </g>
</svg>
