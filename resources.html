  <script>
    /* Runs before the page is drawn: sets flags so animations never flash.
       If the scripts below fail to load, everything is shown after 5 seconds. */
    (function (h) {
      h.classList.add('js');
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !/[?&]reduce=1(&|$)/.test(location.search)) h.classList.add('motion');

        h.classList.add('motion-failsafe');
        h.classList.remove('sheet-arriving', 'is-loading');
      }, 5000);
    })(document.documentElement);
  </script>
